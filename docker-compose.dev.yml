# docker-compose.dev.yml - Development overrides
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Database Service - Development configuration
  db:
    volumes:
      - ./db/init-scripts:/docker-entrypoint-initdb.d
      - ./db/dev-config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    environment:
      - PGDATA=/var/lib/postgresql/data
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Server Service - Development with Air hot reload
  server:
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server:/app:cached
      - media_data:/app/media
      - server_go_mod_cache:/go/pkg/mod
      - server_go_build_cache:/root/.cache/go-build
      - server_apk_cache:/etc/apk/cache
    ports:
      - "${ANKIDEMY_BIND_ADDRESS:-127.0.0.1}:${DEBUG_EXTERNAL_PORT:-45176}:2345"
    environment:
      - APP_ENV=development
      - GIN_MODE=debug
      - LOG_LEVEL=debug
      - GOGC=off                      # Disable GC during development for faster builds
      - GOFLAGS=-mod=readonly         # Don't update go.mod during development
    command: >
      sh -c "
        # Install git only if not already installed
        if ! command -v git >/dev/null 2>&1; then
          echo 'Installing git...' &&
          apk add --no-cache git;
        fi &&

        # Check if go.mod has changed since last build
        if [ ! -f /tmp/go.mod.md5sum ] || ! md5sum -c /tmp/go.mod.md5sum >/dev/null 2>&1; then
          echo 'Dependencies changed, updating...' &&
          cd /app &&
          go mod download &&
          go mod tidy &&
          md5sum go.mod > /tmp/go.mod.md5sum;
        fi &&

        # Install Air if not already installed
        if ! command -v air >/dev/null 2>&1; then
          echo 'Installing Air...' &&
          go install github.com/air-verse/air@latest;
        fi &&

        # Run Air for live reloading
        cd /app &&
        air
      "
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${SERVER_PORT:-8765}/health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Client Service - Development with hot reload and optimized startup
  client:
    working_dir: /app
    volumes:
      - ./client:/app:delegated
      - client_node_modules:/app/node_modules
      - client_next_cache:/app/.next
      - client_npm_cache:/root/.npm
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=${CHOKIDAR_USEPOLLING:-true}
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_WEBPACK_USEPOLLING=1
      - WATCHPACK_POLLING=${WATCHPACK_POLLING:-true}
      # Optimize Next.js development experience
      - NEXT_TURBO=${NEXT_TURBO:-true}
      - TURBOPACK=true
      - NEXT_OPTIMIZE_FONTS=false
      - NEXT_OPTIMIZE_IMAGES=false
      - NEXT_DISABLE_SOURCEMAPS=true
    command: >
      sh -c "
        # Reinstall when either manifest or npm configuration changes.
        if [ ! -f /tmp/client-dependencies.md5sum ] || ! md5sum -c /tmp/client-dependencies.md5sum >/dev/null 2>&1; then
          echo 'Dependencies changed, updating...' &&
          npm ci &&
          md5sum package.json package-lock.json .npmrc > /tmp/client-dependencies.md5sum;
        fi &&
        
        # Run the lockfile-pinned Next.js development server.
        npm run dev
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Development utility service - Database admin
  pgadmin:
    image: dpage/pgadmin4:9.16
    profiles: ["tools"]
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:?Set PGADMIN_EMAIL before enabling the tools profile}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD before enabling the tools profile}
      - PGADMIN_LISTEN_PORT=5050
      # sshtunnel 0.4.0 triggers this harmless warning under Python 3.14.
      # Keep other Python warnings visible while pgAdmin waits for an upstream fix.
      - "PYTHONWARNINGS=ignore:'return' in a 'finally' block:SyntaxWarning"
    ports:
      - "${ANKIDEMY_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-45177}:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - app-network
    restart: unless-stopped

volumes:
  server_go_mod_cache:
  server_go_build_cache:
  server_apk_cache:
  pgadmin_data:
  client_node_modules:
  client_next_cache:
  client_npm_cache:
