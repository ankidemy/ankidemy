# docker-compose.yml - Base configuration for all environments
services:
  # Database Service (Postgres)
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - ./db/init-scripts:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache / Read-model event helper (Redis)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Server Service (Go)
  server:
    image: golang:1.25.12-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_PORT}
      - REDIS_ADDR=${REDIS_ADDR}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB}
      - REDIS_CACHE_PREFIX=${REDIS_CACHE_PREFIX}
      - SERVER_PORT=${SERVER_PORT:-8765}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN:-http://localhost:45173}
      - JWT_SECRET=${JWT_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ANKIDEMY_ORG_ROAM_ENABLED=${ANKIDEMY_ORG_ROAM_ENABLED:-false}
      - ANKIDEMY_ORG_ROAM_BRIDGE_URL=${ANKIDEMY_ORG_ROAM_BRIDGE_URL:-}
      - ANKIDEMY_ORG_ROAM_BRIDGE_TOKEN=${ANKIDEMY_ORG_ROAM_BRIDGE_TOKEN:-}
    ports:
      # Reverse proxies and Cloudflare Tunnel can reach this loopback socket;
      # it is never published to LAN/WAN interfaces by default.
      - "${ANKIDEMY_BIND_ADDRESS:-127.0.0.1}:${SERVER_EXTERNAL_PORT:-45174}:${SERVER_PORT:-8765}"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Client Service (NextJS)
  client:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:45174}
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_ALLOWED_DEV_ORIGINS=${NEXT_ALLOWED_DEV_ORIGINS:-localhost,127.0.0.1}
    ports:
      # Keep the browser entrypoint host-local. Public deployments should use
      # a reverse proxy or outbound tunnel instead of widening this binding.
      - "${ANKIDEMY_BIND_ADDRESS:-127.0.0.1}:${CLIENT_PORT:-45173}:3000"
    networks:
      - app-network
    depends_on:
      - server

networks:
  app-network:

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_data:
    driver: local
